description: "Assertion 10: latency - Response time validation"

prompts:
  - |
    Extract product information from the following description and return it as JSON with these fields:
    - name (string)
    - price (number)
    - storage (string)
    - color (string, if available)

    Product: {{product_description}}

    Return only valid JSON, no additional text.

providers:
  - openrouter:nvidia/nemotron-3.5-lightning:free

tests:
  - description: "Test 1: Response under 5 seconds"
    vars:
      product_description: "Microsoft Surface Pro 9 - $1299, 512GB, Graphite"
    assert:
      - type: latency
        threshold: 10

  - description: "Test 2: Fast response under 3 seconds"
    vars:
      product_description: "Kindle Paperwhite - $139, 16GB, Black"
    assert:
      - type: latency
        threshold: 3000

  - description: "Test 3: Very fast response under 2 seconds"
    vars:
      product_description: "Apple Watch Series 9 - $399, GPS, Midnight"
    assert:
      - type: latency
        threshold: 2000